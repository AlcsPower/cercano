[package]
name = "cercano-audit"
version = "0.1.0"
edition = "2021"
authors = ["Cercano Contributors"]
license = "AGPL-3.0-only"
description = "CLI tool for offline audit verification and export in Cercano"

[[bin]]
name = "cercano-audit"
path = "src/main.rs"

[dependencies]
audit-core = { path = "../audit-core" }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "=3.10.1"
rand_core = { version = "0.6", features = ["std"] }
