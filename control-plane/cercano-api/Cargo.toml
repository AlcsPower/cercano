[package]
name = "cercano-api"
version = "0.1.0"
edition = "2021"
authors = ["Cercano Contributors"]
license = "AGPL-3.0-only"
description = "Control plane REST API for Cercano remote desktop system"

[dependencies]
axum = "0.7"
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "json", "fmt"] }
http = "1.1"
thiserror = "2.0"
argon2 = { version = "0.5", default-features = false, features = ["std", "password-hash"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
tempfile = "=3.10.1"
http-body-util = "0.1"
