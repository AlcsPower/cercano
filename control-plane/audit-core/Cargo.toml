[package]
name = "audit-core"
version = "0.1.0"
edition = "2021"
authors = ["Cercano Contributors"]
license = "AGPL-3.0-only"
description = "Core append-only audit log and hash chain for Cercano"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
thiserror = "2.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.38", features = ["sync", "rt", "macros"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core"] }
hex = "0.4"

[dev-dependencies]
tempfile = "=3.10.1"
tokio = { version = "1.38", features = ["full"] }
rand_core = { version = "0.6", features = ["std"] }
