#
# Workflow de CI para compilar el binario base reproducible de Cercano,
# verificar determinismo bit-a-bit (TC-F3-021), generar SBOM SPDX 2.3 y publicar artefactos.

name: Base Binary (Reproducible Build & SBOM)

on:
  push:
    branches:
      - main
      - 'feat/F3-*'
      - 'feat/**'
      - 'fix/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:
    inputs:
      verify_reproducibility:
        description: 'Ejecutar doble compilación para verificación de reproducibilidad (TC-F3-021)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-reproducible-base:
    name: Build Reproducible Base Binary & SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-randr0-dev libxdo-dev libxfixes-dev libpam0g-dev \
            libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libsodium-dev pkg-config \
            libvpx-dev libyuv-dev libaom-dev libopus-dev clang libclang-dev nasm
          if [ ! -f /usr/share/pkgconfig/libyuv.pc ] && [ ! -f /usr/lib/x86_64-linux-gnu/pkgconfig/libyuv.pc ]; then
            printf '%s\n' \
              'prefix=/usr' \
              'exec_prefix=${prefix}' \
              'libdir=${prefix}/lib/x86_64-linux-gnu' \
              'includedir=${prefix}/include' \
              '' \
              'Name: libyuv' \
              'Description: Library for YUV scaling and conversion' \
              'Version: 0.0.1' \
              'Libs: -L${libdir} -lyuv' \
              'Cflags: -I${includedir}' | sudo tee /usr/share/pkgconfig/libyuv.pc
          fi

      - name: Verify license headers
        run: bash tools/check-license-headers.sh

      - name: Apply patches
        run: bash tools/apply-patches

      # scrap y magnum-opus buscan libvpx/libyuv/aom/opus bajo VCPKG_ROOT. Mismo commit fijado y mismos
      # overlay ports que vendor/client/vcpkg.json y el build de Windows, para que las librerías sean deterministas.
      - name: Setup vcpkg with GitHub Actions cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          doNotCache: false

      - name: Install vcpkg dependencies (x64-linux)
        run: |
          # Modo clásico (fuera del manifiesto) para no compilar ffmpeg, que solo usa la feature hwcodec.
          "$VCPKG_ROOT/vcpkg" install libvpx libyuv opus aom \
            --triplet x64-linux \
            --overlay-ports=vendor/client/res/vcpkg
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Build reproducible base binary and SBOM
        run: |
          BUILD_FLAGS="--out-dir dist/base --sbom"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.verify_reproducibility }}" = "true" ]; then
            BUILD_FLAGS="$BUILD_FLAGS --verify"
          fi
          bash builder/build-base.sh $BUILD_FLAGS

      - name: Verify SHA-256 checksums
        run: |
          cd dist/base
          sha256sum -c SHA256SUMS

      - name: Validate SBOM format (SPDX 2.3 JSON)
        run: |
          test -f dist/base/sbom.spdx.json
          python3 -m json.tool dist/base/sbom.spdx.json > /dev/null
          echo "OK: SBOM SPDX 2.3 JSON validado correctamente."

      - name: Inspect build metadata
        run: |
          cat dist/base/build-info.json

      - name: Upload reproducible base artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cercano-base-binary-linux-x86_64
          path: |
            dist/base/
          retention-days: 14
          if-no-files-found: error
