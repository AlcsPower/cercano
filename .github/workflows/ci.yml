name: CI

on:
  push:
    branches:
      - main
      - 'docs/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'docs/**'
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  license:
    name: License & Header Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify repository LICENSE (AGPL-3.0-only)
        run: bash tools/check-license.sh

      - name: Verify source files license headers (AGPL-3.0)
        run: bash tools/check-license-headers.sh

  rust-checks:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Format check
        run: |
          if [ -f Cargo.toml ]; then
            cargo fmt --all -- --check
          else
            echo "Cargo.toml not present yet. Skipping fmt."
          fi

      - name: Clippy
        run: |
          if [ -f Cargo.toml ]; then
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          else
            echo "Cargo.toml not present yet. Skipping clippy."
          fi

      - name: Run tests
        run: |
          if [ -f Cargo.toml ]; then
            cargo test --workspace --all-targets --all-features
          else
            echo "Cargo.toml not present yet. Skipping tests."
          fi

  web-console:
    name: Web Console (TypeScript & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: console-web/package-lock.json

      - name: Install dependencies
        run: cd console-web && npm ci

      - name: Build Web Console
        run: cd console-web && npm run build

  security:
    name: Security & License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        if: hashFiles('Cargo.lock') != '' || hashFiles('Cargo.toml') != ''
        with:
          command: check licenses advisories bans sources
          arguments: --all-features

      - name: Run cargo-audit
        uses: rustsec/audit-check@v1.4.1
        if: hashFiles('Cargo.lock') != ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  server-build:
    name: Server Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Build server binary
        env:
          SODIUM_USE_PKG_CONFIG: 1
        run: |
          if [ -d vendor/server ] && [ -f vendor/server/Cargo.toml ]; then
            cargo build --release --manifest-path vendor/server/Cargo.toml
          elif [ -d server ] && [ -f server/Cargo.toml ]; then
            cargo build --release --manifest-path server/Cargo.toml
          elif [ -f Cargo.toml ] && cargo metadata --no-deps --format-version 1 | grep -q '"name":"cercano-server"'; then
            cargo build --release -p cercano-server
          else
            echo "Server crate not present yet. Skipping server build."
          fi

  client-check:
    name: Client Check (Linux cargo check)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-randr0-dev libxdo-dev libxfixes-dev libpam0g-dev libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsodium-dev pkg-config

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: vendor/client -> target

      - name: Cargo check client
        env:
          SODIUM_USE_PKG_CONFIG: 1
          CXXFLAGS: "-include cstdint"
          CFLAGS: "-include stdint.h"
        run: cargo check --manifest-path vendor/client/Cargo.toml
