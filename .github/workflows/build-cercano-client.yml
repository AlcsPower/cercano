#
# Workflow oficial de compilación del cliente de escritorio gráfico completo (Flutter + Rust)
# Produce el binario base 'cercano.exe' y los instaladores Windows (Soporte y Técnico).

name: Build Cercano Desktop Client (Production)

on:
  workflow_dispatch:
    inputs:
      target_server_ip:
        description: 'IP o Host del servidor Cercano (defecto: 172.16.8.163)'
        required: false
        default: '172.16.8.163'
        type: string
  push:
    branches:
      - 'docs/F0-01-gobernanza'
      - 'feat/**'
      - 'main'
    tags:
      - 'v*'

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  generate-bridge:
    name: Generate Flutter-Rust Bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache bridge codegen binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-expand
            ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_VERSION }}-expand-${{ env.CARGO_EXPAND_VERSION }}-frb-${{ env.FLUTTER_RUST_BRIDGE_VERSION }}

      - name: Generate Bridge files
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/client
          # Verificar consistencia exacta entre Cargo.lock y FLUTTER_RUST_BRIDGE_VERSION
          LOCK_FRB="$(awk '{gsub(/\r/, "")} /^name = "flutter_rust_bridge"$/{getline; gsub(/\r/, ""); gsub(/"/, "", $3); print $3; exit}' Cargo.lock)"
          if [ "$LOCK_FRB" != "${{ env.FLUTTER_RUST_BRIDGE_VERSION }}" ]; then
            echo "ERROR: Cargo.lock tiene flutter_rust_bridge=$LOCK_FRB pero workflow usa ${{ env.FLUTTER_RUST_BRIDGE_VERSION }}" >&2
            exit 1
          fi
          if [ ! -x "$HOME/.cargo/bin/cargo-expand" ]; then
            cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          fi
          if [ ! -x "$HOME/.cargo/bin/flutter_rust_bridge_codegen" ]; then
            cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          fi
          "$HOME/.cargo/bin/cargo-expand" --version
          "$HOME/.cargo/bin/flutter_rust_bridge_codegen" --version
          pushd flutter && flutter pub get && popd
          "$HOME/.cargo/bin/flutter_rust_bridge_codegen" \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          for f in \
            src/bridge_generated.rs \
            src/bridge_generated.io.rs \
            flutter/lib/generated_bridge.dart \
            flutter/lib/generated_bridge.freezed.dart; do
            test -s "$f" || { echo "ERROR: Archivo de bridge ausente o vacio: vendor/client/$f" >&2; exit 1; }
          done
          sha256sum \
            src/bridge_generated.rs \
            src/bridge_generated.io.rs \
            flutter/lib/generated_bridge.dart \
            flutter/lib/generated_bridge.freezed.dart

      - name: Upload Bridge Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          if-no-files-found: error
          path: |
            vendor/client/src/bridge_generated.rs
            vendor/client/src/bridge_generated.io.rs
            vendor/client/flutter/lib/generated_bridge.dart
            vendor/client/flutter/lib/generated_bridge.freezed.dart

  build-windows-client:
    name: Build Windows Client (x86_64)
    needs: [generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore Bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: vendor/client

      - name: Validate restored Bridge files
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/client
          for f in \
            src/bridge_generated.rs \
            src/bridge_generated.io.rs \
            flutter/lib/generated_bridge.dart \
            flutter/lib/generated_bridge.freezed.dart; do
            test -s "$f" || { echo "ERROR: Archivo de bridge no restaurado en vendor/client/$f" >&2; exit 1; }
          done
          grep -q "EventToUI" src/bridge_generated.rs || {
            echo "ERROR: src/bridge_generated.rs no contiene bindings para EventToUI" >&2
            exit 1
          }
          sha256sum \
            src/bridge_generated.rs \
            src/bridge_generated.io.rs \
            flutter/lib/generated_bridge.dart \
            flutter/lib/generated_bridge.freezed.dart

      - name: Apply Cercano patches to upstream
        shell: bash
        run: |
          bash tools/check-license.sh
          bash tools/apply-patches

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Precache Flutter Windows engine
        run: |
          flutter doctor -v
          flutter precache --windows

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Setup vcpkg with GitHub Actions cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (x64-windows-static)
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          cd vendor/client
          $VCPKG_ROOT/vcpkg install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Build Full Cercano Client Executable
        shell: bash
        run: |
          VCPKG_INSTALLED="$VCPKG_ROOT/installed/x64-windows-static"
          printf 'VCPKG_ROOT=%s\n' "$VCPKG_ROOT"
          find "$VCPKG_INSTALLED/include" \( -path '*libavcodec*' -o -path '*libavutil*' \) | head -20
          test -f "$VCPKG_INSTALLED/include/libavcodec/avcodec.h"
          test -f "$VCPKG_INSTALLED/include/libavutil/attributes.h"
          test -d "$VCPKG_INSTALLED/lib"
          ls -la "$VCPKG_INSTALLED/lib"/av*.lib
          cd vendor/client
          python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram

      - name: Stage Client Base Binary into dist/base
        shell: bash
        run: |
          mkdir -p dist/base
          cp -r vendor/client/flutter/build/windows/x64/runner/Release/* dist/base/
          if [ -f dist/base/rustdesk.exe ]; then
            mv -f dist/base/rustdesk.exe dist/base/cercano.exe
          fi
          echo "OK: Binario base staged en dist/base/cercano.exe"
          ls -la dist/base/

      - name: Switch to Rust stable for cercano-build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Generate Signed Installers with cercano-build
        shell: bash
        run: |
          SERVER_IP="${{ github.event.inputs.target_server_ip || '172.16.8.163' }}"
          echo "Generando instaladores apuntando al servidor: $SERVER_IP"

          # Compilar generador cercano-build
          cargo build --release -p cercano-build

          # Generar paquete Soporte
          target/release/cercano-build \
            --profile docs/specs/examples/profile-soporte-lan.json \
            --base-binary dist/base/cercano.exe \
            --out dist/builds \
            --package-windows

          # Generar paquete Técnico
          target/release/cercano-build \
            --profile docs/specs/examples/profile-tecnico-lan.json \
            --base-binary dist/base/cercano.exe \
            --out dist/builds \
            --package-windows

          ls -la dist/builds/cercano-soporte-1.0.0/
          ls -la dist/builds/cercano-tecnico-1.0.0/

      - name: Upload Windows Client Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cercano-windows-production-installers
          path: |
            dist/builds/
            dist/base/cercano.exe
          retention-days: 14
