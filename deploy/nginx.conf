# Configuración de Nginx para Cercano Web Console y Reverse Proxy
# SPDX-License-Identifier: AGPL-3.0-only
# Copyright (C) 2026 Cercano Contributors

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirección opcional a HTTPS si se cuenta con certificados activos en /etc/nginx/certs
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Healthcheck interno (la API no se expone por HTTP)
    location /healthz {
        proxy_pass http://cercano-api:21114/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Todo lo demás viaja cifrado: consola y API solo por HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Configuración TLS HTTPS (cuando se montan certificados en /etc/nginx/certs)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/cercano.crt;
    ssl_certificate_key /etc/nginx/certs/cercano.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad reforzadas para TLS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy inverso a API de control de Cercano (cercano-api)
    location /api/ {
        proxy_pass http://cercano-api:21114/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Healthcheck proxy
    location /healthz {
        proxy_pass http://cercano-api:21114/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Soporte SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
