# deny.toml — Configuración de licencias, avisos y dependencias para Cercano
# Documentación: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "AGPL-3.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2025-0023", reason = "tokio broadcast channel clone unsoundness, not triggered in current usage" },
    { id = "RUSTSEC-2026-0386", reason = "tokio AsyncFd I/O safety constructor deprecation" },
    { id = "RUSTSEC-2026-0367", reason = "zip SUID/SGID preservation on extraction" },
    { id = "RUSTSEC-2026-0368", reason = "zip symlink outside destination" },
    { id = "RUSTSEC-2026-0369", reason = "zip symlink unix permissions" },
    { id = "RUSTSEC-2026-0429", reason = "zip symlink buffer alloc abort" },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys bundled sqlite CVE-2026-119375 via sqlx" },
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained advisory, widely used across ecosystem" },
    { id = "RUSTSEC-2026-0545", reason = "zip AES truncated plaintext without auth check, unused feature" },
    { id = "RUSTSEC-2026-0548", reason = "zip ZipStreamReader local header check, ZipStreamReader not used" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
