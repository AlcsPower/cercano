openapi: 3.1.0
info:
  title: Cercano API
  description: >
    Control Plane REST API for Cercano remote desktop system.
    Provides device registration, authentication, health checks, and audit ingestion.
  version: 0.1.0
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: http://localhost:21114
    description: Local Cercano API server (default port 21114)

paths:
  /healthz:
    get:
      summary: Health check endpoint
      description: Returns the health status, service identifier, and version of the cercano-api service.
      operationId: getHealth
      parameters:
        - name: x-trace-id
          in: header
          required: false
          description: Optional correlation trace identifier (UUIDv7 or UUIDv4). If omitted, a new UUIDv7 is generated by the server.
          schema:
            type: string
            example: "0192e21b-640b-7825-94ee-a5efbc3205fa"
      responses:
        '200':
          description: Service is healthy and operational.
          headers:
            x-trace-id:
              description: Request trace identifier echoed back or newly generated.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "ok"
                service: "cercano-api"
                version: "0.1.0"
        '500':
          description: Internal server error.
          headers:
            x-trace-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          description: Service state indicator.
          example: "ok"
        service:
          type: string
          description: Name of the service component.
          example: "cercano-api"
        version:
          type: string
          description: Semantic version string of the running release.
          example: "0.1.0"

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Short machine-readable error code.
          example: "internal_error"
        message:
          type: string
          description: Human-readable error description.
          example: "An unexpected error occurred."
        trace_id:
          type: string
          description: Associated correlation trace identifier.
          example: "0192e21b-640b-7825-94ee-a5efbc3205fa"
